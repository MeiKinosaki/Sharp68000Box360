name: Xenon toolchain cloud build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "cloud/**"

permissions:
  contents: read

# Keep only one expensive Xenon build active per branch.
concurrency:
  group: sharp68000box360-xenon-${{ github.ref }}
  cancel-in-progress: true

jobs:
  xenon-toolchain:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout Sharp68000Box360
        uses: actions/checkout@v4

      - name: Verify prebuilt libXenon container
        run: |
          set -euo pipefail
          docker pull free60/libxenon:latest
          docker run --rm free60/libxenon:latest bash -lc '
            set -euo pipefail
            export DEVKITXENON=/usr/local/xenon
            export PATH="$DEVKITXENON/bin:$DEVKITXENON/usr/bin:$PATH"
            command -v xenon-gcc
            command -v xenon-g++
            command -v xenon-ld
            xenon-gcc --version
          '

      - name: Build Sharp68000Box360 ELF in container
        run: |
          set -euo pipefail
          mkdir -p build-report
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            free60/libxenon:latest \
            bash -lc '
              set -euo pipefail
              export DEVKITXENON=/usr/local/xenon
              export PATH="$DEVKITXENON/bin:$DEVKITXENON/usr/bin:$PATH"
              test -f Makefile
              test -f source/main.c
              make clean
              make
              test -s xenon.elf
              test -s xenon.elf32
              file xenon.elf xenon.elf32
              cp xenon.elf xenon.elf32 build-report/
              git clone --depth 1 https://github.com/Free60Project/libxenon.git /tmp/libxenon-src
              make -C /tmp/libxenon-src/devkitxenon/examples/xenon/graphics/cube
              test -s /tmp/libxenon-src/devkitxenon/examples/xenon/graphics/cube/cube.elf32
              cp /tmp/libxenon-src/devkitxenon/examples/xenon/graphics/cube/cube.elf32 build-report/libxenon-cube-smoke.elf32
            '

      - name: Create cloud build report
        if: always()
        shell: bash
        run: |
          mkdir -p build-report
          {
            echo "# Sharp68000Box360 cloud build report"
            echo
            echo "- Commit: $GITHUB_SHA"
            echo "- Runner: $(uname -a)"
            if [ -s build-report/xenon.elf ]; then
              echo "- Project ELF: built and non-empty"
            else
              echo "- Project ELF: NOT BUILT"
            fi
            if [ -s build-report/xenon.elf32 ]; then
              echo "- Project ELF32: built and non-empty"
            else
              echo "- Project ELF32: NOT BUILT"
            fi
            if [ -s build-report/libxenon-cube-smoke.elf32 ]; then
              echo "- Upstream cube smoke test: built"
            else
              echo "- Upstream cube smoke test: NOT BUILT"
            fi
            echo "- Scope: boot/console diagnostic only; CPU core and X68000 devices are not yet integrated."
            echo "- default.xex: not generated by this workflow."
          } > build-report/README.md

      - name: Upload cloud build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sharp68000box360-xenon-cloud-build
          path: build-report/
          if-no-files-found: error
          retention-days: 14
