name: Xenon toolchain cloud build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "cloud/**"

permissions:
  contents: read

jobs:
  xenon-toolchain:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      DEVKITXENON: /usr/local/xenon
    steps:
      - name: Checkout Sharp68000Box360
        uses: actions/checkout@v4

      - name: Install libXenon build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential gcc g++ make cmake autoconf automake libtool pkg-config bison flex texinfo wget curl xz-utils bzip2 file gcc-multilib libgmp-dev libmpfr-dev libmpc-dev

      - name: Checkout upstream libXenon
        run: git clone --depth 1 https://github.com/Free60Project/libxenon.git /tmp/libxenon

      - name: Build Xenon cross-toolchain
        working-directory: /tmp/libxenon/toolchain
        run: ./build-xenon-toolchain toolchain

      - name: Build libXenon libraries
        working-directory: /tmp/libxenon/toolchain
        run: ./build-xenon-toolchain libxenon

      - name: Export Xenon environment
        run: |
          echo "DEVKITXENON=$DEVKITXENON" >> "$GITHUB_ENV"
          echo "$DEVKITXENON/bin" >> "$GITHUB_PATH"
          echo "$DEVKITXENON/usr/bin" >> "$GITHUB_PATH"

      - name: Verify compiler and linker
        run: |
          set -euo pipefail
          command -v xenon-gcc
          command -v xenon-g++
          command -v xenon-ld
          xenon-gcc --version
          xenon-g++ --version
          xenon-ld --version

      - name: Build upstream libXenon cube smoke test
        working-directory: /tmp/libxenon/toolchain
        run: ./build-xenon-toolchain cube

      - name: Build Sharp68000Box360 ELF
        run: |
          set -euo pipefail
          test -f Makefile
          test -f source/main.c
          make clean
          make
          test -s xenon.elf
          test -s xenon.elf32
          file xenon.elf xenon.elf32
          mkdir -p build-report
          cp xenon.elf xenon.elf32 build-report/

      - name: Create cloud build report
        if: always()
        shell: bash
        run: |
          mkdir -p build-report
          {
            echo "# Sharp68000Box360 cloud build report"
            echo
            echo "- Commit: $GITHUB_SHA"
            echo "- Host: $(uname -a)"
            echo "- Xenon compiler: $(command -v xenon-gcc || echo unavailable)"
            echo "- Xenon C++ compiler: $(command -v xenon-g++ || echo unavailable)"
            echo "- Xenon linker: $(command -v xenon-ld || echo unavailable)"
            if [ -s xenon.elf ]; then
              echo "- Project ELF: built (xenon.elf)"
            else
              echo "- Project ELF: NOT BUILT"
            fi
            if [ -s xenon.elf32 ]; then
              echo "- Project ELF32: built (xenon.elf32)"
            else
              echo "- Project ELF32: NOT BUILT"
            fi
            echo "- Scope: boot/console diagnostic only; emulator CPU and X68000 devices are not yet integrated."
          } > build-report/README.md
          if [ -f /tmp/libxenon/toolchain/cube.elf32 ]; then
            cp /tmp/libxenon/toolchain/cube.elf32 build-report/libxenon-cube-smoke.elf32
          fi

      - name: Upload cloud build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sharp68000box360-xenon-cloud-build
          path: build-report/
          if-no-files-found: error
          retention-days: 14
